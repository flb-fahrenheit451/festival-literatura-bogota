    <button type="button" class="participant-card" data-name="Daniel E. Monje" data-role="Profesor y youtuber" data-bio="Profesor, youtuber y lector de ciencia ficción. Docente del Programa Curricular de Arte Danzario de la Facultad de Artes ASAB de la Universidad Distrital Francisco José de Caldas y del programa de Cine y Televisión de la Universidad Manuela Beltrán. Estudió Cine y Televisión en la Universidad Nacional de Colombia e hizo un Magíster en Artes Plásticas y Visuales en la misma universidad y un Doctorado en Imagen, Arte, Cultura y Sociedad en la Universidad Autónoma del Estado de Morelos. en Cuernavaca.  Por los pasados 25 años he sido  docente en diferentes universidades en Colombia y México. Ha sido reconocido como artista visual, artista del performance, videoartista y ocasionalmente como escritor.  He sido un asiduo colaborador del colectivo Cienciaficcionarios que se dedica a la promoción de la lectura de la ciencia ficción y desde hace seis años produce el canal de youtube estereoscopio con un poco más de 300 episodios.">
      <div class="avatar">?</div>
      <div class="info"><div class="name">Daniel E. Monje</div><div class="role">Profesor y youtuber</div></div>
    </button>
    <button type="button" class="participant-card" data-name="Fabián M. Martínez" data-role="Escritor, periodista y docente" data-bio="Es escritor, periodista y docente, Magíster en Periodismo de la Universidad de los Andes y Licenciado en Español y Literatura de la Universidad Industrial de Santander (UIS). Es autor de los libros Cuentos de lo raro (2024), El encanto podrido de Bogotá (2021; segunda edición, 2026), El sexo de las salamandras (2015), Cuervos en la ventana (2013), Una ciudad llamada Bucaranada (2010) y Me llamo José Antonio Galán (2010). Su obra explora las relaciones entre lo extraño, la memoria, el territorio y la naturaleza, transitando entre el realismo, lo fantástico, lo onírico y lo liminal. En su escritura combina géneros y recursos como la ciencia ficción, el terror, el surrealismo, el realismo sucio, el humor y la crónica, desde una vocación experimental que busca nuevas formas de aproximarse a la realidad y a la naturaleza humana.
Ha recibido diversos reconocimientos nacionales, entre ellos el Premio Nacional de Cuento RCN-MEN (2008), el Premio de Cuento de la Gobernación de Cundinamarca (2011), el Premio de Novela de la Gobernación de Santander (2015), el Premio Nacional de Libro de Cuentos de la UIS y el Premio de Crónica Ciudad de Bogotá (2020). En 2017 fue seleccionado como becario del programa de Periodismo Cultural Gabriel García Márquez de la Fundación Gabo y fue finalista del Premio Latinoamericano de Crónica Nuevas Plumas. Ha publicado crónicas, reportajes y ficciones en medios como El Tiempo, El Malpensante, VICE, Revista Anfibia, 070, Corónica y DONJUAN, entre otros. Actualmente es docente de la Maestría en Creación Literaria de la Universidad Central y ha dirigido talleres de escritura creativa, redacción y proyectos nacionales de lectura y escritura.
">
      <div class="avatar">?</div>
      <div class="info"><div class="name">Fabián M. Martínez</div><div class="role">Escritor, periodista y docente</div></div>
    </button>
    <button type="button" class="participant-card" data-name="Jairo Andrade" data-role="Escritor y creador de ciberliteratura" data-bio="Escritor y creador de ciberliteratura, autor de la novela Cadáveres de papel y del libro de cuentos Puntos de fuga. Su obra ha sido reconocida con importantes premios y becas, entre ellos el Premio Internacional de Narrativa UNAM-Siglo XXI Editores (México), el Premio Nacional de Cuento Jorge Gaitán Durán, el Premio Distrital de Cuento Ciudad de Bogotá y el Premio de Cuento IDCT Bogotá. También fue beneficiario de la Beca de Edición a Autores Colombianos del Ministerio de Cultura y finalista del concurso de poesía Reverso, en la modalidad interdisciplinar.
Su trabajo explora las posibilidades de la literatura en entornos digitales y experimentales. Actualmente desarrolla interfaces cerebro-computador orientadas a la creación de literatura cinética en vivo, integrando escritura, tecnología e interacción en tiempo real. Ha dirigido talleres de creación literaria y participado como jurado en diversos concursos y espacios académicos, entre ellos iniciativas de universidades y el Concurso Nacional de Cuento RCN-Ministerio de Educación. Su trayectoria combina la creación literaria con la investigación y experimentación en nuevas formas de narrar.
">
      <div class="avatar">?</div>
      <div class="info"><div class="name">Jairo Andrade</div><div class="role">Escritor y creador de ciberliteratura</div></div>
    </button>
    <button type="button" class="participant-card" data-name="Claudia Amador" data-role="Escritora y gestora cultural" data-bio="Es escritora, tallerista, librera y gestora cultural. Es profesional en Estudios Literarios por la Universidad Autónoma de Bucaramanga y máster en Escrituras Creativas por la Universidad de La Rioja. Es autora de Macrored, su primer libro de relatos de ciencia ficción, publicado en 2023 gracias a la Beca de Publicación de Obra Inédita del Programa Nacional de Estímulos del Ministerio de Cultura, y de la novela Altasangre, con la que obtuvo en 2024 el Premio Nacional de Narrativa Elisa Mújica. Publicada por Laguna Libros y Mirabilia Libros en 2025 y por Alianza Editorial en 2026, Altasangre se encuentra en proceso de traducción al inglés, francés, portugués y danés.
Ha sido ganadora de diversos premios nacionales e internacionales de narrativa y poesía, entre ellos el XV Concurso Internacional de Cuento Ciudad de Pupiales (2020) y el Concurso Relata (2022). Sus cuentos han sido publicados en Colombia, México, España y Uruguay, y forman parte de antologías como Contaminación futura Vol. 10, Fisura: antología colombiana de ficción extraña, Las ciclistas: antología fantástica de autoras colombianas y Rituales para una piedra sangrante: antología de folk horror colombiano. Su trayectoria combina la creación literaria con la formación y la gestión cultural, explorando especialmente los territorios de la ciencia ficción, lo fantástico y la narrativa especulativa.
">
      <div class="avatar">?</div>
      <div class="info"><div class="name">Claudia Amador</div><div class="role">Escritora y gestora cultural</div></div>
    </button>
    <button type="button" class="participant-card" data-name="Karonlains Alarcón" data-role="Escritora y gestora cultural" data-bio="Nacida en el Tolima (Colombia), es antropóloga de la Universidad Nacional de Colombia, con estudios de lengua árabe y ciencias islámicas en Alejandría, Egipto, y una maestría en Creación Literaria. Escritora de ficción y de temas islámicos, se desempeña además como tallerista de escritura y mediación cultural. Ha trabajado como tallerista para IDARTES en Bosa, en el programa Becas de Mujeres Rurales y en el Laboratorio Multiverso, promoviendo procesos comunitarios de creación literaria. 

Actualmente es editora en Máktaba Fundación Cultural y tallerista en la Escuela de Escritura Multiverso, espacios dedicados al diálogo entre el islam y Latinoamérica. Ha sido finalista de diversos concursos de narrativa y ha publicado cuentos, dos novelas y varios libros sobre islam. También ha editado más de quince títulos especializados. Su proyecto más reciente es El Séptimo Espacio, un laboratorio de ciencia ficción comunitaria desarrollado en Bosa, cuyo resultado fue el libro Bosa 3036, una obra colectiva que imagina futuros posibles para el territorio.
"
    >
      <div class="avatar">?</div>
      <div class="info"><div class="name">Karonlains Alarcón</div><div class="role">Escritora y gestora cultural</div></div>
    </button>
    <button type="button" class="participant-card" data-name="Angélica Caballero" data-role="Librera y editora" data-bio="Fotógrafa, diseñadora gráfica y magíster en Estética e Historia del Arte. Se ha desempeñado como docente de fotografía en diversas instituciones de educación superior en Bogotá. Además, es fundadora, librera y editora de Mirabilia Libros, una editorial independiente bogotana especializada en la literatura de género fantástico, la ciencia ficción, la fantasía y el terror. Surgida del impulso de su emblemática librería especializada, la editorial ha consolidado un catálogo enfocado primordialmente en los formatos breves, como el cuento y la novela corta, abriendo espacios tanto para nuevas voces como para referentes consolidados de la narrativa especulativa. Bajo la premisa de que la imaginación es multiforme y transgrede fronteras creativas, Mirabilia se ha convertido en un proyecto fundamental para la dinamización, visibilización y difusión de la literatura insólita e independiente en el país.
">
      <div class="avatar">?</div>
      <div class="info"><div class="name">Angélica Caballero</div><div class="role">Librera y editora</div></div>
    </button>
    <button type="button" class="participant-card" data-name="Luis Carlos Barragán" data-role="Artista plástico y escritor" data-bio="Estudió Artes Plásticas en la Universidad Nacional de Colombia e Historia del Arte Islámico en la Universidad Americana del Cairo. Ha publicado cuatro novelas de ciencia ficción: Vagabunda Bogotá, que ganó el X Premio de la Cámara de Comercio de Medellín y fue nominada al Rómulo Gallego; El Gusano, que recibió una mención honorífica en el Concurso de Novela de Ciencia Ficción Isaac Asimov del Ateneo de Puerto Real; Tierra Contrafuturo, con la editorial Minotauro, y Eidolónica, ganadora de la Beca de publicación de IDARTES. También publicó la colección Parásitos Perfectos, de cuentos de ciencia ficción, y fue antologador de Máquinas Mestizas, de ciencia ficción latinoamericana. Su trabajo se ha publicado en buena parte de Latinoamérica y se ha traducido al inglés, francés, chino y farsi. También le fue otorgado el Premio Sheridan le Fanu por su contribución al campo de la ciencia ficción y la fantasía.
">
      <div class="avatar">?</div>
      <div class="info"><div class="name">Luis Carlos Barragán</div><div class="role">Artista plástico y escritor</div></div>
    </button>
    <button type="button" class="participant-card" data-name="Andrea Salgado" data-role="Escritora, periodista, profesora" data-bio="Escritora, periodista, profesora de escritura creativa y editora. Fue directora cultural de la Feria Internacional del Libro de Bogotá (2018-2019) y escritora residente de la Universidad de los Andes (2022-2024). Autora de las novelas La lesbiana, el oso y el ponqué, El sueño del árbol y Constelación; así como del ensayo Six Feet Under. Cuentos, crónicas y poemas suyos han sido publicados recientemente en las antologías Cuerpos (Planeta, 2019), Cómo la flor (Planeta, 2021), Antología de relatos de la literatura colombiana (FCE 2023) y La vorágine dormida (Babel, 2024) publicación de la que fue también editora.">
      <div class="avatar">?</div>

    <button type="button" class="participant-card" data-name="4L3PH" data-role="Creado por Guillermo Zúñiga & Nelson Vera" data-bio="4L3PH «Creatividad y Futuro(s)» es un nodo de co-creadores y guías de viaje colombianos y latinoamericanos liderados por Guillermo Zúñiga y Nelson Vera. Alrededor de la imaginación de narrativas especulativas y la experimentación artística a través de diversos y nuevos medios, su propósito es activar procesos de investigación, construcción de conocimiento, reflexión crítica, imaginación, experimentación, diseño y co-creación, colectiva, participativa, interactiva, generativa y en red, de y con unos mundos y futuros «otros», humanos, más-que-humanos y no-humanos,  (desde ya) posibles (y hasta extraños, fantásticos, surreales y en apariencia imposibles), en devenir y (en) por-venir, en y desde un Sur Global en expansión, y en «red-sonancia» con el planeta. 4L3PH recientemente fue invitado a participar como co-curador de la exhibición artística del congreso internacional de Narrativas Digitales Interactivas ICIDS 2025, realizado en Malta. También fue invitado al V encuentro internacional de “Estéticas de Ciencia Ficción 2025”, del Instituto Nacional de Bellas Artes y Literatura de México.">
      <div class="avatar">?</div>
      <div class="info"><div class="name">4L3PH</div><div class="role">Creado por Guillermo Zúñiga & Nelson Vera</div></div>
